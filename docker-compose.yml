# Infrastructure only: Redis (limiter state + BullMQ) and MongoDB (rules + denial history).
services:
  redis:
    image: redis:7
    command: ["redis-server", "--maxmemory-policy", "noeviction"]  # BullMQ requires noeviction
    ports: ["6379:6379"]
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
